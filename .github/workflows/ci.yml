name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Zig 0.16.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check formatting
        run: zig fmt --check src build.zig
      - name: Build
        run: zig build
      - name: Test Debug
        run: zig build test
      - name: Test ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe test
      - name: Scan smoke test
        run: zig build run -- scan . --json
