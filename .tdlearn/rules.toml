# tdlearn rules for tdlearn itself
# Layer order: HIGHER order = more foundational.
# A layer may only import layers with >= its own order.
#
# Scale: every `min_*` key is a score in [0, 1] — the same scale stored in
# .tdlearn/baseline.json. The terminal and the JSON output print the same
# quality signal as an integer per 10000, so `min_quality = 0.7` is
# "7000/10000", and a `min_*` floor is always compared as a fraction, never
# as a per-10000 integer.
#
# Nothing in this file is written by the tool: `tdlearn gate --save` only
# rewrites .tdlearn/baseline.json.

[constraints]
# Geometric mean of the five root-cause scores; see README "Quality Signal".
min_quality = 0.7
# Per-root-cause floor, on the normalized `(Q + 0.5) / 1.5` scale.
min_modularity = 0.5
# Zero SCC cycles in the union of import, call and inherit edges.
# Redundant with the acyclicity root cause on purpose: `gate` only fails on a
# cycle *increase* against the baseline, so this is what keeps a regression
# from being absorbed by an unrelated quality gain.
max_cycles = 0

# Size ceilings. The largest implementation file is src/main.zig at 1152
# lines, so 1200 is the narrowest round value that admits it, and the previous
# documented exception (1400, needed while rules.zig still carried its own
# 388 lines of tests) is gone: those tests now live in rules_test.zig and
# main_test.zig, so every file under src/ is implementation plus its own
# separate test file.
#
# These are ceilings, not targets. The next file to cross one fails
# `tdlearn check .` in CI, and lowering a value fails until the file is split.
max_file_lines = 1200
max_fn_lines = 80

# Per-function complexity ceilings. Unlike max_fn_lines, these report every
# offending function by name, file and line, so `check` is a work list and not
# a number to look up. 20 cyclomatic is the classic practical ceiling; 45
# cognitive is just under this tree's previous worst case. The equality root
# cause is a Gini over function complexity, so holding this tail down is what
# moves the quality signal.
max_cyclomatic = 20
max_cognitive = 45

[[layers]]
name = "core"
paths = ["src/core/**"]
order = 3

[[layers]]
name = "metrics"
paths = ["src/metrics/**"]
order = 2

[[layers]]
name = "analysis"
paths = ["src/analysis/**"]
order = 2

[[layers]]
name = "cli"
# The CLI's own test file is part of the same layer: leaving it out would let
# it import anything without the layer rules noticing.
paths = ["src/main.zig", "src/main_test.zig"]
order = 0

[[boundaries]]
from = "src/metrics/**"
to = "src/main.zig"
reason = "metrics must not import the CLI"
